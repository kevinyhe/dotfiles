# tmux 3.6 config. Reload with: prefix + r

# --- Prefix: Ctrl+a instead of Ctrl+b -------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal -------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 10          # no lag on Esc in nvim
set -g focus-events on
set -g history-limit 50000
set -g mouse on

# --- Windows and panes ----------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S: #W"

# New panes and windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Split toward a direction: prefix, then Ctrl+arrow.
# Keep Ctrl held after Ctrl+a and tap the arrow.
bind C-Right split-window -h  -c "#{pane_current_path}"
bind C-Left  split-window -hb -c "#{pane_current_path}"
bind C-Down  split-window -v  -c "#{pane_current_path}"
bind C-Up    split-window -vb -c "#{pane_current_path}"

# Same, but the new pane spans the whole window edge: prefix, then Alt+arrow.
bind M-Right split-window -fh  -c "#{pane_current_path}"
bind M-Left  split-window -fhb -c "#{pane_current_path}"
bind M-Down  split-window -fv  -c "#{pane_current_path}"
bind M-Up    split-window -fvb -c "#{pane_current_path}"

# Swap a pane with its neighbour: prefix, then < or >
bind -r < swap-pane -U
bind -r > swap-pane -D
unbind '"'
unbind %

# Move between panes: prefix + h/j/k/l, or Alt+arrow with no prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Resize panes: prefix + H/J/K/L, hold to repeat
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows: Shift+arrow with no prefix
bind -n S-Left  previous-window
bind -n S-Right next-window

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Copy mode: vi keys, copies to the Windows clipboard -------------------
setw -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"

# --- Look: black, matches the wsltty theme ---------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0c0c0c,fg=#abb2bf"

set -g status-left-length 30
set -g status-left "#[bg=#61afef,fg=#0c0c0c,bold] #S #[bg=#0c0c0c] "

set -g status-right-length 60
set -g status-right "#[fg=#666666]#{b:pane_current_path} #[fg=#61afef]%a %b %d #[fg=#ffffff,bold]%H:%M "

setw -g window-status-format "#[fg=#666666] #I #W "
setw -g window-status-current-format "#[bg=#262626,fg=#ffffff,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#262626,fg=#ffffff"
setw -g mode-style "bg=#3a3a3a,fg=#ffffff"
